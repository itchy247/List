<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picker List - Organized by Aisles & Depts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0066cc',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- Hidden file input for photo upload -->
    <input type="file" id="photoUploadInput" accept="image/*" class="hidden" onchange="handlePhotoSelected(event)">

    <!-- Main Container -->
    <div class="max-w-md mx-auto bg-white dark:bg-gray-900 min-h-screen shadow-xl flex flex-col pb-24">

        <!-- Header -->
        <header class="bg-primary text-white p-4 sticky top-0 z-30 shadow-md">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-white text-primary p-2 rounded-xl shadow-inner flex items-center justify-center">
                        <i class="fa-solid fa-list-check text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold leading-tight">Picker List</h1>
                        <p class="text-xs text-blue-100 opacity-90">Organized by Aisles & Depts</p>
                    </div>
                </div>
                <!-- Top Right Toolbar (No API button, No Trash/Clear button) -->
                <div class="flex items-center space-x-3 text-lg">
                    <button onclick="toggleDarkMode()" class="p-1.5 hover:bg-blue-700 rounded-full transition" title="Toggle Dark Mode">
                        <i id="darkModeIcon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="document.getElementById('photoUploadInput').click()" class="p-1.5 hover:bg-blue-700 rounded-full transition" title="Upload Photo">
                        <i class="fa-solid fa-image"></i>
                    </button>
                    <button onclick="exportList()" class="p-1.5 hover:bg-blue-700 rounded-full transition" title="Export List">
                        <i class="fa-solid fa-file-lines"></i>
                    </button>
                    <button onclick="triggerQuickAddModal()" class="p-1.5 hover:bg-blue-700 rounded-full transition" title="Add Custom Item">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                </div>
            </div>

            <!-- Progress & Total Bar -->
            <div class="mt-4 flex items-center justify-between text-sm bg-blue-800 bg-opacity-40 px-3 py-2 rounded-lg border border-blue-600/30">
                <span id="pickingProgressText" class="font-medium text-blue-50">Picking Progress: 0 / 0 Items</span>
                <span id="totalPriceText" class="font-bold text-white">$0.00 Total</span>
            </div>

            <!-- View Mode Navigation Pills -->
            <div class="mt-3 grid grid-cols-3 gap-2 bg-blue-900/40 p-1 rounded-xl">
                <button onclick="switchView('aisles')" id="tabAisles" class="py-1.5 text-xs font-semibold rounded-lg bg-white text-primary shadow transition text-center">
                    <i class="fa-solid fa-code-branch mr-1"></i> Aisles
                </button>
                <button onclick="switchView('departments')" id="tabDepartments" class="py-1.5 text-xs font-semibold rounded-lg text-blue-100 hover:bg-blue-800/50 transition text-center">
                    <i class="fa-solid fa-layer-group mr-1"></i> Departments
                </button>
                <button onclick="switchView('pickmode')" id="tabPickMode" class="py-1.5 text-xs font-semibold rounded-lg text-blue-100 hover:bg-blue-800/50 transition text-center">
                    <i class="fa-solid fa-compass mr-1"></i> Pick Mode
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="px-4 pt-3 pb-1">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterItems(this.value)" placeholder="Search item, aisle, or section..." class="w-full pl-10 pr-4 py-2.5 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
        </div>

        <!-- Main Content Feed -->
        <main id="itemContainer" class="flex-1 px-4 py-2 space-y-4">
            <!-- Dynamic Items Injected Here -->
        </main>

        <!-- Floating Action Button for Photo Upload -->
        <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40">
            <button onclick="document.getElementById('photoUploadInput').click()" class="bg-gray-900 hover:bg-black dark:bg-blue-600 dark:hover:bg-blue-700 text-white shadow-2xl rounded-full p-4 flex items-center justify-center border-4 border-white dark:border-gray-800 transition transform hover:scale-105">
                <i class="fa-solid fa-camera text-xl"></i>
            </button>
        </div>

    </div>

    <!-- Edit Item Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-gray-100 dark:border-gray-700">
            <h3 class="text-lg font-bold mb-4 flex items-center">
                <i class="fa-solid fa-pen-to-square text-primary mr-2"></i> Edit Picker Item
            </h3>
            <input type="hidden" id="editIndex">
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">Item Name</label>
                    <input type="text" id="editName" class="w-full mt-1 px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">Aisle</label>
                        <input type="text" id="editAisle" class="w-full mt-1 px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">Section</label>
                        <input type="text" id="editSection" class="w-full mt-1 px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">Price ($)</label>
                        <input type="number" step="0.01" id="editPrice" class="w-full mt-1 px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">Quantity</label>
                        <input type="number" id="editQty" class="w-full mt-1 px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400">Category / Department</label>
                    <input type="text" id="editCategory" class="w-full mt-1 px-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm">
                </div>
            </div>
            <div class="mt-6 flex space-x-3">
                <button onclick="closeEditModal()" class="flex-1 py-2.5 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 rounded-xl text-sm font-semibold transition">Cancel</button>
                <button onclick="saveItemEdits()" class="flex-1 py-2.5 bg-primary hover:bg-blue-700 text-white rounded-xl text-sm font-semibold transition">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium z-50 hidden transition-all duration-300"></div>

    <!-- Application Script with Deduplication & Auto-Extraction Logic -->
    <script>
        let currentView = 'aisles';
        let searchQuery = '';

        // Initial default list matching reference sample
        let items = [
            {
                name: "Perdue Harvestland, Organic, Fresh Boneless Chicken...",
                aisle: "A39",
                section: "27",
                price: 6.74,
                qty: 1,
                category: "Meat & Poultry",
                perishable: true,
                picked: false,
                image: "https://images.unsplash.com/photo-1604503468506-a8da13d82791?auto=format&fit=crop&w=300&q=80"
            },
            {
                name: "Pork Center Cut Loin Chops Thin Boneless, 14 Count,...",
                aisle: "A40",
                section: "1",
                price: 5.77,
                qty: 1,
                category: "Meat & Poultry",
                perishable: true,
                picked: false,
                image: "https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?auto=format&fit=crop&w=300&q=80"
            },
            {
                name: "Marketside Organic Grass-fed Ground Beef 93% Lean/ 7%...",
                aisle: "A40",
                section: "9",
                price: 23.48,
                qty: 1,
                category: "Meat & Poultry",
                perishable: true,
                picked: false,
                image: "https://images.unsplash.com/photo-1588168333986-5078d3ae3976?auto=format&fit=crop&w=300&q=80"
            },
            {
                name: "Marketside Organic Fresh Broccoli Florets, 12 Oz",
                aisle: "A1",
                section: "13",
                price: 3.97,
                qty: 1,
                category: "Produce",
                perishable: true,
                picked: false,
                image: "https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?auto=format&fit=crop&w=300&q=80"
            }
        ];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Deduplication Engine: Normalize name for strict matching
        function normalizeName(name) {
            return name.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
        }

        function findExistingItemIndex(newItemName) {
            const normalizedNew = normalizeName(newItemName);
            return items.findIndex(item => normalizeName(item.name) === normalizedNew);
        }

        function renderList() {
            const container = document.getElementById('itemContainer');
            container.innerHTML = '';

            // Filter items based on search query
            const filtered = items.filter(item => 
                item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.aisle.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.section.toLowerCase().includes(searchQuery.toLowerCase()) ||
                item.category.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // Update Progress & Totals
            const pickedCount = items.filter(i => i.picked).length;
            const totalPrice = items.reduce((sum, i) => sum + (i.price * i.qty), 0);
            document.getElementById('pickingProgressText').innerText = `Picking Progress: ${pickedCount} / ${items.length} Items`;
            document.getElementById('totalPriceText').innerText = `$${totalPrice.toFixed(2)} Total`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-3"></i>
                        <p class="text-sm font-medium">No items found.</p>
                        <p class="text-xs text-gray-500 mt-1">Upload a photo or add items to get started.</p>
                    </div>
                `;
                return;
            }

            if (currentView === 'aisles' || currentView === 'pickmode') {
                // Group by Aisle
                const aislesMap = {};
                filtered.forEach(item => {
                    const key = item.aisle || 'Unassigned Aisle';
                    if (!aislesMap[key]) aislesMap[key] = [];
                    aislesMap[key].push(item);
                });

                for (const [aisle, aisleItems] of Object.entries(aislesMap)) {
                    const headerEl = document.createElement('div');
                    headerEl.className = 'font-bold text-base text-gray-800 dark:text-gray-200 mt-3 mb-2 flex items-center justify-between';
                    headerEl.innerHTML = `<span>Aisle ${aisle}</span> <span class="text-xs font-normal text-gray-400">${aisleItems.length} items</span>`;
                    container.appendChild(headerEl);

                    aisleItems.forEach(item => {
                        const originalIndex = items.indexOf(item);
                        container.appendChild(createItemCard(item, originalIndex));
                    });
                }
            } else if (currentView === 'departments') {
                // Group by Category / Department
                const deptMap = {};
                filtered.forEach(item => {
                    const key = item.category || 'General';
                    if (!deptMap[key]) deptMap[key] = [];
                    deptMap[key].push(item);
                });

                for (const [dept, deptItems] of Object.entries(deptMap)) {
                    const headerEl = document.createElement('div');
                    headerEl.className = 'font-bold text-base text-gray-800 dark:text-gray-200 mt-3 mb-2 flex items-center justify-between';
                    headerEl.innerHTML = `<span>${dept}</span> <span class="text-xs font-normal text-gray-400">${deptItems.length} items</span>`;
                    container.appendChild(headerEl);

                    deptItems.forEach(item => {
                        const originalIndex = items.indexOf(item);
                        container.appendChild(createItemCard(item, originalIndex));
                    });
                }
            }
        }

        function createItemCard(item, index) {
            const card = document.createElement('div');
            card.className = `bg-white dark:bg-gray-800 border ${item.picked ? 'border-green-500/50 bg-green-50/20 dark:bg-green-950/20' : 'border-gray-100 dark:border-gray-700'} rounded-2xl p-3 shadow-sm flex items-center space-x-3 transition`;
            
            card.innerHTML = `
                <div class="relative w-16 h-16 flex-shrink-0">
                    <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover rounded-xl border border-gray-100 dark:border-gray-700">
                    <button onclick="togglePicked(${index})" class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full ${item.picked ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-300'} flex items-center justify-center text-xs shadow hover:scale-110 transition">
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center space-x-2">
                        ${item.perishable ? '<span class="bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 text-[10px] font-semibold px-2 py-0.5 rounded-md">Perishable</span>' : ''}
                        <span class="text-[10px] text-gray-400 font-medium">${item.category}</span>
                    </div>
                    <h4 class="text-xs font-bold text-gray-900 dark:text-gray-100 truncate mt-0.5">${item.name}</h4>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Aisle <span class="font-bold text-gray-800 dark:text-gray-200">${item.aisle}</span> | Section <span class="font-bold text-gray-800 dark:text-gray-200">${item.section}</span></p>
                    <div class="flex items-center justify-between mt-1">
                        <span class="text-sm font-bold text-gray-900 dark:text-white">$${(item.price * item.qty).toFixed(2)}</span>
                        <div class="flex items-center space-x-3 text-xs">
                            <span class="text-gray-500 dark:text-gray-400 font-medium">qty <strong class="text-gray-800 dark:text-gray-200">${item.qty}</strong></span>
                            <button onclick="openEditModal(${index})" class="text-gray-400 hover:text-primary transition" title="Edit Item"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="removeItem(${index})" class="text-gray-400 hover:text-red-500 transition" title="Delete Item"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function togglePicked(index) {
            items[index].picked = !items[index].picked;
            renderList();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderList();
            showToast("Item removed from list");
        }

        function switchView(view) {
            currentView = view;
            ['tabAisles', 'tabDepartments', 'tabPickMode'].forEach(id => {
                const btn = document.getElementById(id);
                btn.className = "py-1.5 text-xs font-semibold rounded-lg text-blue-100 hover:bg-blue-800/50 transition text-center";
            });
            const activeBtn = document.getElementById(view === 'aisles' ? 'tabAisles' : view === 'departments' ? 'tabDepartments' : 'tabPickMode');
            activeBtn.className = "py-1.5 text-xs font-semibold rounded-lg bg-white text-primary shadow transition text-center";
            renderList();
        }

        function filterItems(query) {
            searchQuery = query;
            renderList();
        }

        function openEditModal(index) {
            const item = items[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editName').value = item.name;
            document.getElementById('editAisle').value = item.aisle;
            document.getElementById('editSection').value = item.section;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editQty').value = item.qty;
            document.getElementById('editCategory').value = item.category;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveItemEdits() {
            const index = parseInt(document.getElementById('editIndex').value);
            items[index].name = document.getElementById('editName').value;
            items[index].aisle = document.getElementById('editAisle').value;
            items[index].section = document.getElementById('editSection').value;
            items[index].price = parseFloat(document.getElementById('editPrice').value) || 0;
            items[index].qty = parseInt(document.getElementById('editQty').value) || 1;
            items[index].category = document.getElementById('editCategory').value;
            closeEditModal();
            renderList();
            showToast("Item updated successfully");
        }

        function triggerQuickAddModal() {
            const name = prompt("Enter item name:");
            if (!name) return;
            const aisle = prompt("Enter aisle (e.g. A12):", "A5");
            const price = parseFloat(prompt("Enter price ($):", "4.99")) || 4.99;
            
            // Check deduplication
            const existingIdx = findExistingItemIndex(name);
            if (existingIdx !== -1) {
                items[existingIdx].qty += 1;
                showToast(`"${items[existingIdx].name}" already exists. Quantity increased to ${items[existingIdx].qty}!`);
            } else {
                items.push({
                    name: name,
                    aisle: aisle || "A1",
                    section: "1",
                    price: price,
                    qty: 1,
                    category: "General Grocery",
                    perishable: false,
                    picked: false,
                    image: "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=300&q=80"
                });
                showToast("New item added to picker list!");
            }
            renderList();
        }

        // Photo Upload & Auto-Extraction with Deduplication
        function handlePhotoSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            showToast("Analyzing photo and extracting items...");

            setTimeout(() => {
                // Simulated intelligent extraction from uploaded photo with deduplication check
                const extractedItems = [
                    { name: "Organic Hass Avocados, 4 Count", aisle: "A2", section: "4", price: 3.49, qty: 2, category: "Produce", perishable: true, image: "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?auto=format&fit=crop&w=300&q=80" },
                    { name: "Almond Milk Unsweetened Vanilla 32fl oz", aisle: "A12", section: "3", price: 2.99, qty: 1, category: "Dairy & Eggs", perishable: true, image: "https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=300&q=80" }
                ];

                let addedCount = 0;
                let updatedCount = 0;

                extractedItems.forEach(newItem => {
                    const existingIdx = findExistingItemIndex(newItem.name);
                    if (existingIdx !== -1) {
                        items[existingIdx].qty += newItem.qty;
                        updatedCount++;
                    } else {
                        items.push({
                            ...newItem,
                            picked: false
                        });
                        addedCount++;
                    }
                });

                renderList();
                showToast(`Extracted! Added ${addedCount} new items, updated ${updatedCount} quantities.`);
                event.target.value = ''; // Reset input
            }, 1200);
        }

        function exportList() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "picker_list.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Picker list exported successfully");
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('darkModeIcon').className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
            showToast(isDark ? "Dark mode enabled" : "Light mode enabled");
        }

        // Initial Render
        renderList();
    </script>
</body>
</html>
